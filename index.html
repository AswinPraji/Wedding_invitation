<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Invitation | Sneha & Uday</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background lighting -->
  <div class="ambient-background"></div>

  <main class="invitation-app">
    <!-- STEP 1: Initial Cover (Single portrait image) -->
    <section class="step-view step-cover active" id="stepCover" aria-label="Invitation Cover">
      <div class="card-container" id="coverCardContainer">
        <div class="card-wrapper" id="coverCard" role="button" tabindex="0" aria-label="Wedding Invitation Cover. Swipe left or tap to continue.">
          <img src="assets/cover.jpg" alt="Wedding Invitation - 25 Nov 2026" class="invitation-image" draggable="false">
          <!-- Subtle swipe / tap hint -->
          <div class="interaction-hint">
            <span class="hint-text">Swipe left or tap</span>
            <span class="hint-arrow">→</span>
          </div>
        </div>
      </div>
    </section>

    <!-- STEP 2 & STEP 3: Folded & Unfolded Three-Panel Invitation -->
    <section class="step-view step-book" id="stepBook" aria-label="Wedding Invitation">
      <!-- Top navigation / close controls -->
      <nav class="book-nav" id="bookNav" aria-label="Invitation navigation">
        <button type="button" class="nav-btn" id="btnBackToCover" aria-label="Back to cover">
          <span class="nav-icon">←</span>
          <span class="nav-label">Cover</span>
        </button>
        <button type="button" class="nav-btn close-btn" id="btnCloseBook" aria-label="Close invitation">
          <span class="nav-label">Fold</span>
          <span class="nav-icon">✕</span>
        </button>
      </nav>

      <!-- 3D Gatefold Stage -->
      <div class="book-stage" id="bookStage">
        <div class="tri-fold-container folded" id="bookContainer">
          
          <!-- Center Main Panel (50% width, stationary base) -->
          <div class="panel panel-center" id="panelCenter">
            <img src="assets/inside_left.jpg" alt="Wedding Invitation Celebration Details" class="panel-image" draggable="false">
            <div class="fold-shadow fold-shadow-left"></div>
            <div class="fold-shadow fold-shadow-right"></div>
            <div class="center-shade-overlay" id="centerShade"></div>
          </div>

          <!-- Left Narrow Panel (25% width, hinges on its right edge at x = 25%) -->
          <div class="panel-flap flap-left" id="flapLeft">
            <!-- Inner face: first uploaded image with QR codes -->
            <div class="flap-face flap-face-inner">
              <img src="assets/panel_left.jpg" alt="Locations and QR Codes" class="panel-image" draggable="false">
              
              <!-- QR Code Hotspots -->
              <a href="https://www.google.com/maps/search/?api=1&query=41%2C+2nd+D+Cross+Rd%2C+Chikka+Banaswadi%2C+OMBR+Layout%2C+Banaswadi%2C+Bengaluru%2C+Karnataka+560043" 
                 target="_blank" 
                 rel="noopener noreferrer" 
                 class="qr-hitbox qr-church" 
                 id="qrChurch"
                 title="Open Church Location in Google Maps"
                 aria-label="Open Church Location in Google Maps">
                <span class="qr-glow-ring"></span>
              </a>

              <a href="https://maps.app.goo.gl/Vu8y6fwdc5gVqGgn9?g_st=aw" 
                 target="_blank" 
                 rel="noopener noreferrer" 
                 class="qr-hitbox qr-reception" 
                 id="qrReception"
                 title="Open Reception Location in Google Maps"
                 aria-label="Open Reception Location in Google Maps">
                <span class="qr-glow-ring"></span>
              </a>
            </div>

            <!-- Outer face: original closed invitation card (left half of closed_book.jpg) -->
            <div class="flap-face flap-face-outer blank-flap flap-outer-left">
              <img src="assets/closed_book.jpg" alt="Closed Wedding Invitation" class="closed-cover-img closed-img-left" draggable="false">
              <div class="seam-shadow seam-shadow-left"></div>
            </div>
          </div>

          <!-- Right Narrow Panel (25% width, hinges on its left edge at x = 75%) -->
          <div class="panel-flap flap-right" id="flapRight">
            <!-- Inner face: second uploaded image with calendar & quote -->
            <div class="flap-face flap-face-inner">
              <img src="assets/panel_right.jpg" alt="Wedding Calendar and Quote" class="panel-image" draggable="false">
            </div>

            <!-- Outer face: original closed invitation card (right half of closed_book.jpg) -->
            <div class="flap-face flap-face-outer blank-flap flap-outer-right">
              <img src="assets/closed_book.jpg" alt="Closed Wedding Invitation" class="closed-cover-img closed-img-right" draggable="false">
              <div class="seam-shadow seam-shadow-right"></div>
            </div>
          </div>

          <!-- STEP 2 DEDICATED CLOSED CARD: Shows Image 2 (closed_book.jpg) cleanly and completely -->
          <div class="folded-card-cover" id="foldedCardCover" role="button" tabindex="0" aria-label="Closed Wedding Invitation. Swipe or tap to open.">
            <img src="assets/closed_book.jpg" alt="Closed Wedding Invitation" class="folded-card-image" draggable="false">
            <div class="folded-prompt" id="foldedPrompt">
              <span class="prompt-icon">✧</span>
              <span class="prompt-text">Swipe or tap to open</span>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/script.js"></script>
</body>
</html>
